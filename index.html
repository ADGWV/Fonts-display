<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>عارض الخطوط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/opentype.js@latest/dist/opentype.min.js"></script>
<style>
  :root{
    --bg:#04060b;
    --panel:rgba(18,23,36,.68);
    --panel-2:#121826;
    --panel-3:#182134;
    --panel-4:#202b44;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.14);
    --text:#f2f5fa;
    --muted:#8f9ab1;
    --accent:#5eead4;
    --accent-2:#38bdf8;
    --violet:#a78bfa;
    --gold:#ecc877;
    --danger:#fb7185;
    --ok:#34d399;
    --grad:linear-gradient(135deg,var(--accent),var(--accent-2) 55%,var(--violet));
    --grad-soft:linear-gradient(135deg,rgba(94,234,212,.18),rgba(56,189,248,.18) 55%,rgba(167,139,250,.18));
    --r-lg:20px; --r-md:14px; --r-sm:10px;
    --shadow:0 12px 40px rgba(0,0,0,.5);
    --glow:0 0 0 1px rgba(94,234,212,.35), 0 0 28px rgba(94,234,212,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    display:flex;height:100vh;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    background:
      radial-gradient(900px 420px at 90% -10%, rgba(20,60,52,.55) 0%, transparent 60%),
      radial-gradient(800px 400px at -10% 110%, rgba(30,45,90,.5) 0%, transparent 60%),
      radial-gradient(500px 300px at 50% 50%, rgba(50,30,80,.14) 0%, transparent 70%),
      var(--bg);
  }
  input,textarea,select{-webkit-user-select:text;user-select:text}
  .orb{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0;opacity:.4;animation:float 26s ease-in-out infinite}
  .orb-1{width:480px;height:480px;background:radial-gradient(circle,#0f4a3c,transparent 70%);top:-160px;left:-120px}
  .orb-2{width:520px;height:520px;background:radial-gradient(circle,#163a6e,transparent 70%);bottom:-180px;right:-120px;animation-delay:-13s}
  .orb-3{width:380px;height:380px;background:radial-gradient(circle,#3b2470,transparent 70%);top:40%;left:55%;opacity:.25;animation-delay:-7s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.12)}}

  /* ====== القائمة الجانبية ====== */
  #sidebar{
    width:320px;min-width:320px;
    background:linear-gradient(170deg,rgba(24,30,46,.92),rgba(12,16,26,.96));
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-left:1px solid var(--line);
    display:flex;flex-direction:column;padding:22px 18px;gap:14px;
    overflow-y:auto;position:fixed;top:0;right:0;bottom:0;z-index:100;
    transform:translateX(105%);transition:transform .38s cubic-bezier(.22,1,.36,1);
    box-shadow:-24px 0 60px rgba(0,0,0,.6);
  }
  body.sidebar-open #sidebar{transform:translateX(0)}
  #sidebar::before{
    content:'';position:absolute;top:0;right:0;left:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.5;
  }
  #sidebarOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99;display:none;backdrop-filter:blur(4px)}
  body.sidebar-open #sidebarOverlay{display:block}

  .brand{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .brand .dot{
    width:11px;height:11px;border-radius:50%;background:var(--grad);
    box-shadow:0 0 14px var(--accent);flex-shrink:0;
  }
  .brand h1{font-size:16px;margin:0;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .brand span{color:var(--muted);font-size:11px}

  #dropzone{
    border:1.5px dashed var(--line-strong);border-radius:var(--r-md);padding:24px 14px;text-align:center;
    color:var(--muted);font-size:13px;cursor:pointer;transition:.25s;
    background:rgba(255,255,255,.02);
  }
  #dropzone:hover,#dropzone.drag{border-color:var(--accent);background:var(--grad-soft);color:var(--text);box-shadow:var(--glow)}
  #fileInput{display:none}

  .section-label{
    font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;
    margin:6px 2px 4px;display:flex;align-items:center;gap:8px;font-weight:700;
  }
  .section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent)}

  #fileList{display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1}
  .file-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);
    background:rgba(255,255,255,.03);border:1px solid transparent;cursor:pointer;font-size:13px;
    transition:.18s;
  }
  .file-item:hover{border-color:var(--line-strong);transform:translateX(-3px)}
  .file-item.active{
    border-color:rgba(94,234,212,.45);background:var(--grad-soft);
    box-shadow:inset 0 0 0 1px rgba(94,234,212,.15), 0 6px 20px rgba(94,234,212,.08);
  }
  .file-icon{
    width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:900;flex-shrink:0;letter-spacing:.5px;
    background:linear-gradient(135deg,#14604e,#0d7a62);color:#8ff5d8;
    box-shadow:0 4px 12px rgba(13,122,98,.35);
  }
  .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .file-remove{color:var(--muted);font-size:14px;padding:4px 8px;border-radius:8px;transition:.15s}
  .file-remove:hover{color:var(--danger);background:rgba(251,113,133,.12)}

  #status{font-size:11px;color:var(--muted);min-height:16px}

  /* ====== الرئيسي ====== */
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
  #topbar{
    padding:calc(14px + env(safe-area-inset-top)) 76px 12px 18px;
    border-bottom:1px solid var(--line);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:rgba(6,9,15,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    z-index:5;
  }
  #docTitle{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #docTitle b{color:var(--text);font-weight:800}

  #content{flex:1;overflow-y:auto;padding:16px 18px calc(60px + env(safe-area-inset-bottom));scroll-behavior:smooth}
  #empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px;text-align:center}
  #empty .glyph{
    font-size:44px;opacity:.9;width:84px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);border:1px solid var(--line-strong);box-shadow:var(--shadow);
  }

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#2a3348,#1f2940);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* ====== الأزرار ====== */
  #menuToggle{
    position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;z-index:101;
    width:46px;height:46px;border-radius:14px;
    background:rgba(24,30,46,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line-strong);color:var(--text);display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:18px;transition:.22s;box-shadow:var(--shadow);touch-action:manipulation;
  }
  #menuToggle:hover{border-color:var(--accent);color:var(--accent);transform:rotate(-6deg) scale(1.06);box-shadow:var(--glow)}
  #menuToggle:active{transform:scale(.94)}

  .toolbtn{
    background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);
    padding:9px 14px;border-radius:12px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;
    transition:.18s;white-space:nowrap;touch-action:manipulation;position:relative;
  }
  .toolbtn:hover{border-color:rgba(94,234,212,.5);color:var(--accent);transform:translateY(-1px)}
  .toolbtn:active{transform:scale(.95)}
  .toolbtn.active{
    border-color:rgba(94,234,212,.55);color:#06211c;font-weight:800;
    background:var(--grad);box-shadow:0 6px 20px rgba(94,234,212,.28);
  }
  .toolbtn.primary{
    background:var(--grad);color:#04201b;font-weight:900;border:none;padding:12px 18px;font-size:13px;
    box-shadow:0 8px 26px rgba(56,189,248,.32);
  }
  .toolbtn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(94,234,212,.4)}
  .btn-group{display:flex;gap:5px}
  .btn-group .toolbtn{padding:9px 11px}

  /* ====== الكروت ====== */
  .card-title{font-size:13px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card-title::before{content:'';width:4px;height:16px;border-radius:4px;background:var(--grad);box-shadow:0 0 10px var(--accent)}
  .editor-card,.settings-card,.font-meta{
    background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),var(--panel);
    border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .editor-card::before,.settings-card::before,.font-meta::before{
    content:'';position:absolute;top:0;right:18px;left:18px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  }
  .editor-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}

  /* ====== أسطر الكتابة ====== */
  .line-row{display:flex;gap:8px;margin-bottom:9px}
  .line-row textarea{
    flex:1;min-height:52px;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--text);
    border-radius:var(--r-md);padding:11px 14px;font-size:14px;outline:none;resize:vertical;font-family:inherit;
    direction:rtl;text-align:right;transition:.2s;box-shadow:inset 0 2px 10px rgba(0,0,0,.25);
  }
  .line-row textarea:focus{border-color:rgba(94,234,212,.55);box-shadow:inset 0 2px 10px rgba(0,0,0,.25),0 0 0 3px rgba(94,234,212,.12)}
  .line-row select{
    max-width:150px;background:var(--panel-3);border:1px solid var(--line);color:var(--text);
    border-radius:var(--r-md);padding:0 10px;font-family:inherit;font-size:12px;outline:none;font-weight:600;
  }
  .line-row select:focus{border-color:rgba(94,234,212,.5)}
  .line-del,.line-inline{
    background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--muted);
    border-radius:12px;width:38px;cursor:pointer;font-size:13px;flex-shrink:0;transition:.18s;font-weight:700;
  }
  .line-del:hover{color:var(--danger);border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.08)}
  .line-inline:hover{color:var(--accent);border-color:rgba(94,234,212,.5)}
  .line-inline.on{
    color:#06211c;background:var(--grad);border-color:transparent;
    box-shadow:0 4px 14px rgba(94,234,212,.25);
  }
  .line-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

  .live-preview{
    border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:18px;
    background:linear-gradient(170deg,rgba(0,0,0,.35),rgba(255,255,255,.02)),var(--panel-3);
    min-height:1.6em;word-break:break-word;overflow-wrap:anywhere;
    direction:rtl;text-align:right;unicode-bidi:isolate;
    box-shadow:inset 0 2px 16px rgba(0,0,0,.4), 0 0 0 1px rgba(94,234,212,.06);
  }

  /* ====== إعدادات التصدير ====== */
  .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:14px}
  .settings-grid label{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);font-weight:600}
  .settings-grid input,.settings-grid select{
    background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--text);border-radius:var(--r-md);
    padding:10px 12px;font-family:inherit;font-size:13px;outline:none;width:100%;transition:.2s;font-weight:600;
  }
  .settings-grid input:focus,.settings-grid select:focus{border-color:rgba(94,234,212,.5);box-shadow:0 0 0 3px rgba(94,234,212,.1)}

  #valignGroup{width:100%;display:flex;gap:5px}
  #valignGroup .toolbtn{flex:1;justify-content:center;display:flex;padding:10px 4px}

  .palette{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .swatch{
    width:28px;height:28px;border-radius:9px;border:1px solid rgba(255,255,255,.16);
    cursor:pointer;padding:0;flex-shrink:0;transition:.15s;
  }
  .swatch:hover{transform:scale(1.18)}
  .swatch.active{
    outline:2px solid var(--accent);outline-offset:2px;
    box-shadow:0 0 14px rgba(94,234,212,.5);
  }
  .settings-grid input[dir="ltr"]{direction:ltr;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.5px}

  #exportPreviewWrap{
    margin-bottom:14px;padding:12px;border:1px dashed var(--line-strong);border-radius:var(--r-md);
    background:rgba(0,0,0,.18);
  }
  #exportPreviewInfo{font-size:11px;color:var(--muted);margin-bottom:8px}
  #exportPreview{
    display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:12px;
    background:repeating-conic-gradient(#1a2233 0% 25%, #121826 0% 50%) 0 0 / 20px 20px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }

  /* ====== بيانات الخط ====== */
  .font-meta summary{cursor:pointer;font-size:13px;font-weight:900;color:var(--accent);padding:4px 0;display:flex;align-items:center;gap:8px;list-style:none}
  .font-meta summary::-webkit-details-marker{display:none}
  .font-meta summary::before{content:'▾';transition:.2s;display:inline-block;color:var(--muted)}
  .font-meta[open] summary::before{transform:rotate(180deg);color:var(--accent)}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px;margin:14px 0}
  .meta-grid label{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);font-weight:600}
  .meta-grid input,.meta-grid textarea{
    background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);
    padding:9px 12px;font-family:inherit;font-size:12px;outline:none;transition:.2s;font-weight:600;
  }
  .meta-grid input:focus,.meta-grid textarea:focus{border-color:rgba(94,234,212,.5);box-shadow:0 0 0 3px rgba(94,234,212,.1)}
  .meta-grid textarea{resize:vertical}

  /* ====== المقارنة ====== */
  #compareBox textarea{
    width:100%;min-height:60px;background:rgba(0,0,0,.28);color:var(--text);border:1px solid var(--line);
    border-radius:var(--r-md);padding:11px 14px;font-size:14px;outline:none;resize:vertical;font-family:inherit;margin-top:10px;
    direction:rtl;text-align:right;transition:.2s;
  }
  #compareBox textarea:focus{border-color:rgba(94,234,212,.5);box-shadow:0 0 0 3px rgba(94,234,212,.1)}
  .compare-text{word-break:break-word;min-height:1.4em;line-height:1.7;direction:rtl;unicode-bidi:isolate}

  /* ====== شبكة الحروف ====== */
  .group-label{
    font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;
    margin:20px 2px 10px;font-weight:800;display:flex;align-items:center;gap:8px;
  }
  .group-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent)}
  .grid{display:flex;flex-wrap:wrap;gap:8px;direction:rtl}
  .glyph-box{
    width:50px;height:50px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),var(--panel-2);
    border:1px solid var(--line);border-radius:12px;cursor:pointer;
    font-size:20px;transition:.16s;touch-action:manipulation;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  .glyph-box:hover{
    border-color:rgba(94,234,212,.55);transform:scale(1.1) translateY(-2px);
    box-shadow:var(--glow);z-index:2;
  }
  .glyph-box:active{transform:scale(.92)}

  /* ====== معاينة الحرف العائمة ====== */
  #charPreview{
    position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:50%;
    transform:translateX(50%) translateY(24px);
    z-index:250;display:flex;align-items:center;gap:14px;
    background:linear-gradient(165deg,rgba(30,38,58,.95),rgba(15,20,32,.97));
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(94,234,212,.4);border-radius:16px;
    padding:10px 18px;box-shadow:0 18px 50px rgba(0,0,0,.6),var(--glow);
    opacity:0;pointer-events:none;transition:.25s cubic-bezier(.22,1,.36,1);
  }
  #charPreview.show{opacity:1;pointer-events:auto;transform:translateX(50%) translateY(0)}
  #charPreviewGlyph{font-size:40px;line-height:1;min-width:50px;text-align:center}
  #charPreviewCode{font-size:11px;color:var(--muted);direction:ltr;background:rgba(0,0,0,.3);padding:3px 8px;border-radius:7px;border:1px solid var(--line)}
  #charPreviewClose{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 12px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700;transition:.15s}
  #charPreviewClose:hover{color:var(--danger);border-color:rgba(251,113,133,.5)}

  /* ====== التوست ====== */
  #toasts{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92vw;max-width:420px}
  .toast{
    background:linear-gradient(165deg,rgba(30,38,58,.95),rgba(15,20,32,.97));
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line-strong);color:var(--text);padding:12px 18px;
    border-radius:14px;font-size:13px;font-weight:700;box-shadow:var(--shadow);
    animation:tin .3s cubic-bezier(.22,1,.36,1);max-width:100%;text-align:center;
    border-right:3px solid var(--muted);
  }
  .toast.ok{border-right-color:var(--ok)}
  .toast.err{border-right-color:var(--danger)}
  .toast.out{opacity:0;transform:translateY(-10px);transition:.3s}
  @keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

  /* ====== الموبايل ====== */
  @media (max-width: 640px){
    #sidebar{width:min(330px,88vw);min-width:min(330px,88vw);padding:18px 14px;gap:12px}
    #topbar{padding:calc(10px + env(safe-area-inset-top)) 62px 10px 12px}
    #content{padding:12px 12px calc(56px + env(safe-area-inset-bottom))}
    .editor-card,.settings-card,.font-meta{padding:13px;border-radius:16px;margin-bottom:12px}
    .editor-head{gap:8px;margin-bottom:12px}
    .editor-head .section-label{width:100%}
    .line-row{flex-wrap:wrap;gap:7px}
    .line-row textarea{min-height:46px;font-size:15px;border-radius:12px}
    .line-row select{max-width:none;width:100%;height:44px;border-radius:12px}
    .line-del,.line-inline{width:calc(50% - 4px);height:42px;border-radius:12px}
    .line-actions{gap:6px}
    .line-actions .toolbtn{flex:1;justify-content:center;display:flex;padding:10px 6px;font-size:11px;border-radius:11px}
    .grid{gap:7px}
    .glyph-box{width:45px;height:45px;font-size:19px;border-radius:11px}
    .settings-grid{grid-template-columns:repeat(2,1fr);gap:9px}
    .toolbtn{padding:9px 10px;font-size:11px;border-radius:11px}
    .swatch{width:26px;height:26px;border-radius:8px}
    #charPreviewGlyph{font-size:33px;min-width:42px}
    #charPreview{padding:9px 14px;gap:10px;border-radius:14px}
    .orb{opacity:.28}
    #menuToggle{top:calc(10px + env(safe-area-inset-top));left:12px;width:42px;height:42px;border-radius:13px}
    #empty .glyph{width:72px;height:72px;border-radius:20px;font-size:38px}
  }
  @media (max-width: 380px){
    .settings-grid{grid-template-columns:1fr}
    .glyph-box{width:41px;height:41px;font-size:17px}
    .editor-head .btn-group{flex-wrap:wrap}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<button id="menuToggle" aria-label="القائمة">☰</button>
<div id="sidebarOverlay"></div>

<div id="sidebar">
  <div class="brand"><div class="dot"></div><div><h1>عارض الخطوط</h1><span>ملفات ttf فقط</span></div></div>
  <div id="dropzone">اسحب ملف الخط هنا أو اضغط للاختيار<br><span style="font-size:11px;opacity:.8">ttf</span></div>
  <input type="file" id="fileInput" multiple accept=".ttf">
  <div class="section-label">الملفات</div>
  <div id="fileList"></div>
  <div id="status"></div>
</div>

<div id="main">
  <div id="empty">
    <div class="glyph">Aa</div>
    <div>ارفع ملف خط (ttf) عشان تبدأ</div>
  </div>
  <div id="viewer" style="display:none;flex:1;flex-direction:column;min-height:0">
    <div id="topbar"><div id="docTitle"></div></div>
    <div id="content"></div>
  </div>
</div>

<div id="charPreview">
  <div id="charPreviewGlyph"></div>
  <div id="charPreviewCode"></div>
  <button id="charPreviewClose">إغلاق</button>
</div>
<div id="toasts"></div>

<script>
const PALETTE = [
  '#FFFFFF','#F1F3F8','#E7E9EE','#D1D5DB','#9CA3AF','#6B7280','#374151','#1F2937','#111827','#000000',
  '#171B24','#0B0D12','#5EEAD4','#34D399','#059669','#0E3B33','#38BDF8','#123A5E','#E8C468','#F59E0B',
  '#F87171','#EF4444','#FB923C','#F472B6','#A78BFA','#8B5CF6','#64748B'
];

const CHARSETS = [
  { label: 'الحروف الكبيرة', chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('') },
  { label: 'الحروف الصغيرة', chars: 'abcdefghijklmnopqrstuvwxyz'.split('') },
  { label: 'الأرقام', chars: '0123456789'.split('') },
  { label: 'الحروف العربية', chars: 'ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('') },
  { label: 'رموز وعلامات', chars: '!@#$%^&*()-_=+[]{};:\'",.<>/?\\|`~'.split('') },
  { label: 'أشكال عربية موسّعة', chars: arabicForms() }
];

function arabicForms(){
  const out = [];
  for(let i = 0xFB50; i <= 0xFDFF; i++) out.push(String.fromCharCode(i));
  for(let i = 0xFE70; i <= 0xFEFF; i++) out.push(String.fromCharCode(i));
  return out;
}

function supportsCanvasDir(){
  try{
    const c = document.createElement('canvas').getContext('2d');
    if(typeof c.direction === 'string'){ c.direction = 'rtl'; return c.direction === 'rtl'; }
  }catch(e){}
  return false;
}
const CANVAS_RTL = supportsCanvasDir();

const state = { files: [], lines: [], activeLineId: null, activeId: null, carets: {} };
let previewAlign = 'right';
let previewVAlign = 'center';
let previewFontSize = 34;
let previewBgColor = '#171B24';
let previewTextColor = '#FFFFFFFF';
let previewWidth = 0;
let previewHeight = 0;
let previewScale = 2;
let previewFormat = 'png';
const MIN_FONT_SIZE = 10;
const MAX_FONT_SIZE = 500;

const fileListEl = document.getElementById('fileList');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const emptyEl = document.getElementById('empty');
const viewerEl = document.getElementById('viewer');
const contentEl = document.getElementById('content');
const docTitleEl = document.getElementById('docTitle');
const menuToggle = document.getElementById('menuToggle');
const sidebarOverlay = document.getElementById('sidebarOverlay');

function openSidebar(){ document.body.classList.add('sidebar-open'); }
function closeSidebar(){ document.body.classList.remove('sidebar-open'); }

menuToggle.addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
sidebarOverlay.addEventListener('click', closeSidebar);

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => handleFiles(e.target.files));

document.getElementById('charPreviewClose').addEventListener('click', () => {
  const ov = document.getElementById('charPreview');
  if(ov) ov.classList.remove('show');
});
contentEl.addEventListener('scroll', () => {
  const ov = document.getElementById('charPreview');
  if(ov && ov.classList.contains('show') && contentEl.scrollTop < 200) ov.classList.remove('show');
});

function extOf(name){
  const m = name.toLowerCase().match(/\.([a-z0-9]+)$/);
  return m ? m[1] : '';
}

async function handleFiles(fileListRaw){
  const files = Array.from(fileListRaw);
  for(const file of files){
    if(extOf(file.name) !== 'ttf'){
      setStatus(`تم تجاهل "${file.name}" — لازم يكون ملف ttf`);
      continue;
    }
    const id = 'f' + Date.now() + Math.random().toString(36).slice(2,7);
    const entry = { id, name: file.name, raw: file, fontFamily: null, font: null, loaded: false };
    state.files.push(entry);
    renderFileList();
    setStatus(`جارِ تحميل ${file.name}...`);
    try{
      await parseFile(entry);
      setStatus(`تم تحميل ${file.name}`);
    }catch(err){
      console.error(err);
      setStatus(`فشل تحميل ${file.name}: ${err.message}`);
      state.files = state.files.filter(x => x.id !== entry.id);
    }
    renderFileList();
  }
  fileInput.value = '';
}

function setStatus(msg){
  statusEl.textContent = msg;
  if(msg) setTimeout(() => { if(statusEl.textContent === msg) statusEl.textContent = ''; }, 4000);
}

async function parseFile(entry){
  const buf = await entry.raw.arrayBuffer();
  const sig = new Uint8Array(buf.slice(0, 4));
  const sigHex = Array.from(sig).map(b => b.toString(16).padStart(2, '0')).join('');
  const valid = ['00010000', '4f54544f', '74727565', '74746366'];
  if(!valid.includes(sigHex)) throw new Error('الملف مش ملف خط صالح');

  const fontFamily = 'user-font-' + entry.id;
  const ff = new FontFace(fontFamily, buf);
  try{ await ff.load(); }
  catch(e){ throw new Error('تعذّر تحميل الخط — الملف يبدو تالفًا أو غير مدعوم'); }
  document.fonts.add(ff);

  let opf = null;
  try{ if(window.opentype) opf = opentype.parse(buf); }
  catch(e){ console.warn('opentype parse failed:', e); }

  entry.loaded = true;
  entry.fontFamily = fontFamily;
  entry.font = opf;

  if(!state.activeId){
    state.activeId = entry.id;
    state.lines.push({ id: 'ln' + Date.now(), fontId: entry.id, text: 'أبجد هوز حطي كلمن', inline: false });
    state.activeLineId = state.lines[0].id;
  }
  if(state.files.length === 1) selectFile(entry.id);
}

function renderFileList(){
  fileListEl.innerHTML = '';
  state.files.forEach(f => {
    const div = document.createElement('div');
    div.className = 'file-item' + (f.id === state.activeId ? ' active' : '');
    div.innerHTML = `
      <div class="file-icon">TT</div>
      <div class="file-name">${escapeHtml(f.name)}</div>
      <div class="file-remove" data-id="${f.id}">✕</div>`;
    div.addEventListener('click', e => {
      if(e.target.classList.contains('file-remove')) return;
      selectFile(f.id);
    });
    div.querySelector('.file-remove').addEventListener('click', e => {
      e.stopPropagation();
      removeFile(f.id);
    });
    fileListEl.appendChild(div);
  });
}

function removeFile(id){
  state.files = state.files.filter(f => f.id !== id);
  if(state.activeId === id){
    state.activeId = state.files.length ? state.files[0].id : null;
    if(state.activeId){
      selectFile(state.activeId);
    }else{
      state.lines = [];
      state.activeLineId = null;
      showEmpty();
    }
  }else{
    renderFileList();
  }
}

function selectFile(id){
  state.activeId = id;
  if(!state.lines.length){
    state.lines.push({ id: 'ln' + Date.now(), fontId: id, text: 'أبجد هوز حطي كلمن', inline: false });
    state.activeLineId = state.lines[0].id;
  }
  renderFileList();
  showViewer();
  renderActiveDoc();
  closeSidebar();
}

function showEmpty(){ emptyEl.style.display = 'flex'; viewerEl.style.display = 'none'; }
function showViewer(){ emptyEl.style.display = 'none'; viewerEl.style.display = 'flex'; }
function getActive(){ return state.files.find(f => f.id === state.activeId); }
function activeLine(){ return state.lines.find(l => l.id === state.activeLineId) || state.lines[0] || null; }
function resolveFontFamily(id){
  const f = state.files.find(x => x.id === id);
  return f && f.fontFamily ? f.fontFamily : 'inherit';
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildVisualLines(){
  const vls = [];
  state.lines.forEach(line => {
    if(!line.text || !line.text.trim()) return;
    const seg = { text: line.text, family: resolveFontFamily(line.fontId) };
    if(line.inline && vls.length) vls[vls.length - 1].push(seg);
    else vls.push([seg]);
  });
  return vls;
}

function renderActiveDoc(){
  const f = getActive();
  if(!f) return showEmpty();
  docTitleEl.innerHTML = `<b>${escapeHtml(f.name)}</b>`;

  if(!f.loaded){
    contentEl.innerHTML = `<div style="color:var(--muted);padding:20px 0">جارِ المعالجة...</div>`;
    return;
  }

  let html = '';

  /* === كارت الكتابة === */
  html += `<div class="editor-card">
    <div class="editor-head">
      <span class="section-label">الكتابة في: <b style="color:var(--text)">${escapeHtml(f.name)}</b></span>
      <div style="flex:1"></div>
      <div class="btn-group">`;
  ['right','center','left'].forEach(a => {
    html += `<button class="toolbtn align-btn" data-align="${a}" title="محاذاة">${a === 'right' ? '⇥' : a === 'center' ? '≡' : '⇤'}</button>`;
  });
  html += `</div>
      <div class="btn-group">
        <button class="toolbtn" id="fontSmallerBtn" title="تصغير">A−</button>
        <span id="fontSizeLabel" style="font-size:12px;color:var(--muted);min-width:34px;text-align:center">${previewFontSize}</span>
        <button class="toolbtn" id="fontBiggerBtn" title="تكبير">A+</button>
      </div>
    </div>`;

  state.lines.forEach(line => {
    html += `<div class="line-row">
      <textarea data-line-input="${line.id}" dir="rtl" placeholder="اكتب هنا...">${escapeHtml(line.text)}</textarea>
      <select data-line-font="${line.id}">
        ${state.files.map(x => `<option value="${x.id}" ${x.id === line.fontId ? 'selected' : ''}>${escapeHtml(x.name)}</option>`).join('')}
      </select>
      <button class="line-inline ${line.inline ? 'on' : ''}" data-line-inline="${line.id}" title="${line.inline ? 'مكمّل للسطر اللي قبله (جنب بعض)' : 'يبدأ سطر جديد'}">${line.inline ? '⟷' : '↩'}</button>
      <button class="line-del" data-line-del="${line.id}" title="حذف السطر">✕</button>
    </div>`;
  });

  html += `<div class="line-actions">
    <button class="toolbtn" id="addLineBtn">+ إضافة سطر</button>
    <button class="toolbtn" id="clearAllBtn">🗑 مسح الكل</button>
  </div>
  <div class="line-actions">
    <button class="toolbtn" id="spaceBtn">␣ مسافة</button>
    <button class="toolbtn" id="newLineBtn">↩ سطر جديد</button>
    <button class="toolbtn" id="backspaceBtn">⌫ حذف آخر حرف</button>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-bottom:8px">زرار <b style="color:var(--accent)">↩</b> يعني السطر ده يبدأ سطر جديد — زرار <b style="color:var(--accent)">⟷</b> يعني يكمّل جنب السطر اللي قبله بنفس السطر</div>
  <div id="livePreview" class="live-preview" dir="rtl"></div>
  </div>`;

  /* === إعدادات التصدير === */
  html += `<div class="settings-card">
    <div class="card-title">تصدير الصورة</div>
    <div class="settings-grid">
      <label>العرض (px)<input type="number" id="widthInput" min="0" value="${previewWidth}" placeholder="0 = تلقائي"></label>
      <label>الارتفاع (px)<input type="number" id="heightInput" min="0" value="${previewHeight}" placeholder="0 = تلقائي"></label>
      <label>حجم الخط (px)<input type="number" id="fontSizeInput" min="${MIN_FONT_SIZE}" max="${MAX_FONT_SIZE}" value="${previewFontSize}"></label>
      <label>الجودة<select id="scaleSelect">
        <option value="1" ${previewScale === 1 ? 'selected' : ''}>×1</option>
        <option value="2" ${previewScale === 2 ? 'selected' : ''}>×2</option>
        <option value="3" ${previewScale === 3 ? 'selected' : ''}>×3</option>
        <option value="4" ${previewScale === 4 ? 'selected' : ''}>×4</option>
        <option value="6" ${previewScale === 6 ? 'selected' : ''}>×6</option>
        <option value="8" ${previewScale === 8 ? 'selected' : ''}>×8</option>
      </select></label>
      <label>الصيغة<select id="formatSelect">
        <option value="png" ${previewFormat === 'png' ? 'selected' : ''}>PNG</option>
        <option value="jpg" ${previewFormat === 'jpg' ? 'selected' : ''}>JPG</option>
        <option value="webp" ${previewFormat === 'webp' ? 'selected' : ''}>WebP</option>
      </select></label>
      <label>المحاذاة الرأسية
        <div class="btn-group" id="valignGroup">
          <button class="toolbtn valign-btn" data-valign="top">أعلى</button>
          <button class="toolbtn valign-btn active" data-valign="center">وسط</button>
          <button class="toolbtn valign-btn" data-valign="bottom">أسفل</button>
        </div>
      </label>
      <label>لون الخلفية
        <div class="palette" id="bgPalette"></div>
        <input type="text" id="bgColorCode" value="${previewBgColor}" dir="ltr">
      </label>
      <label>لون النص
        <div class="palette" id="textPalette"></div>
        <input type="text" id="textColorCode" value="${previewTextColor}" dir="ltr">
      </label>
    </div>

    <div id="exportPreviewWrap" style="display:none">
      <div id="exportPreviewInfo"></div>
      <img id="exportPreview" alt="معاينة الصورة">
    </div>

    <button class="toolbtn primary" id="downloadImageBtn">⬇ تحميل الصورة</button>
  </div>`;

  /* === بيانات الخط === */
  html += `<details class="font-meta"><summary>بيانات الخط — تعديل وتنزيل نسخة معدّلة</summary>`;
  if(!f.font){
    html += `<div style="color:var(--gold);font-size:12px;margin:10px 0">بيانات الخط مش متاحة — الملف ده متغير (Variable) أو صيغته مش مدعومة للتعديل. المعاينة شغالة عادي.</div>`;
  }else{
    html += `<div class="meta-grid">
      <label>الاسم <input id="metaName" dir="ltr"></label>
      <label>الاسم الكامل <input id="metaFull" dir="ltr"></label>
      <label>الإصدار <input id="metaVersion" dir="ltr"></label>
      <label>PostScript <input id="metaPS" dir="ltr"></label>
      <label>المصمم <input id="metaDesigner" dir="ltr"></label>
      <label>الصانع <input id="metaManufacturer" dir="ltr"></label>
      <label>حقوق النشر <input id="metaCopyright" dir="ltr"></label>
      <label>الترخيص <input id="metaLicense" dir="ltr"></label>
      <label>العلامة التجارية <input id="metaTrademark" dir="ltr"></label>
      <label>الوصف <textarea id="metaDescription" dir="ltr" rows="2"></textarea></label>
    </div>
    <button class="toolbtn primary" id="saveFontBtn">💾 حفظ وتنزيل نسخة معدّلة</button>`;
  }
  html += `</details>`;

  /* === مقارنة الخطوط === */
  html += `<details class="font-meta" id="compareBox"><summary>مقارنة الخطوط — كل الخطوط في سطر واحد</summary>
    <textarea id="compareInput" dir="rtl" placeholder="اكتب نص وشوفه بكل الخطوط المحمّلة جنب بعض...">أبجد هوز 0123456789</textarea>
    <div id="compareList" style="margin-top:10px"></div>
  </details>`;

  /* === شبكة الحروف === */
  const gridFont = resolveFontFamily(activeLine() ? activeLine().fontId : state.activeId);
  html += `<div class="section-label" style="margin:18px 2px 10px">الحروف — دوس على أي حرف يتحط في السطر المحدد</div>`;
  CHARSETS.forEach(group => {
    html += `<div class="group-label">${group.label}</div><div class="grid" style="font-family:${gridFont}">`;
    group.chars.forEach(ch => {
      html += `<div class="glyph-box" data-char="${encodeURIComponent(ch)}">${escapeHtml(ch)}</div>`;
    });
    html += `</div>`;
  });

  contentEl.innerHTML = html;
  attachViewerEvents();
  updatePreviewOnly();
}

function attachViewerEvents(){
  document.querySelectorAll('.align-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      previewAlign = btn.dataset.align;
      updateToolbarState();
      updatePreviewOnly();
    });
  });

  document.querySelectorAll('.valign-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      previewVAlign = btn.dataset.valign;
      updateToolbarState();
      refreshExportPreview();
    });
  });

  document.getElementById('fontSmallerBtn').addEventListener('click', () => {
    previewFontSize = Math.max(MIN_FONT_SIZE, previewFontSize - 4);
    updateToolbarState();
    updatePreviewOnly();
  });
  document.getElementById('fontBiggerBtn').addEventListener('click', () => {
    previewFontSize = Math.min(MAX_FONT_SIZE, previewFontSize + 4);
    updateToolbarState();
    updatePreviewOnly();
  });

  contentEl.querySelectorAll('textarea[data-line-input]').forEach(ta => {
    const id = ta.dataset.lineInput;
    const rememberCaret = () => {
      const line = state.lines.find(l => l.id === id);
      state.carets[id] = ta.selectionStart ?? (line ? line.text.length : 0);
    };
    ta.addEventListener('focus', () => { state.activeLineId = id; rememberCaret(); });
    ta.addEventListener('click', () => { state.activeLineId = id; rememberCaret(); });
    ta.addEventListener('keyup', rememberCaret);
    ta.addEventListener('input', () => {
      const line = state.lines.find(l => l.id === id);
      if(line){ line.text = ta.value; updatePreviewOnly(); }
      state.carets[id] = ta.value.length;
    });
  });

  contentEl.querySelectorAll('select[data-line-font]').forEach(sel => {
    sel.addEventListener('change', () => {
      const line = state.lines.find(l => l.id === sel.dataset.lineFont);
      if(line){ line.fontId = sel.value; updatePreviewOnly(); }
    });
  });

  contentEl.querySelectorAll('.line-inline').forEach(btn => {
    btn.addEventListener('click', () => {
      const line = state.lines.find(l => l.id === btn.dataset.lineInline);
      if(line){ line.inline = !line.inline; renderActiveDoc(); }
    });
  });

  contentEl.querySelectorAll('.line-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.lineDel;
      state.lines = state.lines.filter(l => l.id !== id);
      if(state.activeLineId === id) state.activeLineId = state.lines.length ? state.lines[state.lines.length - 1].id : null;
      if(!state.lines.length) state.lines.push({ id: 'ln' + Date.now(), fontId: state.activeId, text: '', inline: false });
      renderActiveDoc();
    });
  });

  document.getElementById('addLineBtn').addEventListener('click', () => {
    const line = activeLine() || state.lines[0];
    const fontId = line ? line.fontId : state.activeId;
    const nl = { id: 'ln' + Date.now(), fontId, text: '', inline: false };
    state.lines.push(nl);
    state.activeLineId = nl.id;
    renderActiveDoc();
  });

  document.getElementById('clearAllBtn').addEventListener('click', () => {
    state.lines = [{ id: 'ln' + Date.now(), fontId: state.activeId, text: '', inline: false }];
    state.activeLineId = state.lines[0].id;
    renderActiveDoc();
  });

  /* أزرار من غير focus — الكيبورد مش هيظهر غير لما تدوس على المعاينة */
  document.getElementById('spaceBtn').addEventListener('click', () => {
    const line = activeLine(); if(!line) return;
    line.text += ' ';
    state.carets[line.id] = line.text.length;
    const ta = contentEl.querySelector('textarea[data-line-input="' + line.id + '"]');
    if(ta) ta.value = line.text;
    updatePreviewOnly();
  });
  document.getElementById('newLineBtn').addEventListener('click', () => {
    const line = activeLine(); if(!line) return;
    line.text += '\n';
    state.carets[line.id] = line.text.length;
    const ta = contentEl.querySelector('textarea[data-line-input="' + line.id + '"]');
    if(ta) ta.value = line.text;
    updatePreviewOnly();
  });
  document.getElementById('backspaceBtn').addEventListener('click', () => {
    const line = activeLine(); if(!line) return;
    line.text = line.text.slice(0, -1);
    state.carets[line.id] = line.text.length;
    const ta = contentEl.querySelector('textarea[data-line-input="' + line.id + '"]');
    if(ta) ta.value = line.text;
    updatePreviewOnly();
  });

  document.getElementById('widthInput').addEventListener('change', e => {
    previewWidth = Math.max(0, parseInt(e.target.value, 10) || 0);
    refreshExportPreview();
  });
  document.getElementById('heightInput').addEventListener('change', e => {
    previewHeight = Math.max(0, parseInt(e.target.value, 10) || 0);
    refreshExportPreview();
  });
  document.getElementById('fontSizeInput').addEventListener('input', e => {
    previewFontSize = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, parseInt(e.target.value, 10) || 34));
    updateToolbarState();
    updatePreviewOnly();
  });
  document.getElementById('scaleSelect').addEventListener('change', e => {
    previewScale = parseInt(e.target.value, 10) || 2;
    refreshExportPreview();
  });
  document.getElementById('formatSelect').addEventListener('change', e => {
    previewFormat = e.target.value;
    refreshExportPreview();
  });

  setupColor('bgColorCode', 'bgPalette', v => {
    previewBgColor = v;
    const pv = document.getElementById('livePreview');
    if(pv) pv.style.background = parseColor(v);
    refreshExportPreview();
  });
  setupColor('textColorCode', 'textPalette', v => {
    previewTextColor = v;
    const pv = document.getElementById('livePreview');
    if(pv) pv.style.color = parseColor(v);
    refreshExportPreview();
  });

  document.getElementById('downloadImageBtn').addEventListener('click', downloadPreviewAsImage);

  contentEl.querySelectorAll('.glyph-box').forEach(box => {
    box.addEventListener('click', () => {
      const ch = decodeURIComponent(box.dataset.char);
      const line = activeLine(); if(!line){ toast('ضيف سطر الأول', 'err'); return; }
      const ta = contentEl.querySelector('textarea[data-line-input="' + line.id + '"]');
      let start, end;
      if(ta && document.activeElement === ta){
        start = ta.selectionStart ?? line.text.length;
        end = ta.selectionEnd ?? line.text.length;
      }else{
        const remembered = state.carets[line.id];
        start = (typeof remembered === 'number' && remembered >= 0 && remembered <= line.text.length) ? remembered : line.text.length;
        end = start;
      }
      line.text = line.text.slice(0, start) + ch + line.text.slice(end);
      state.carets[line.id] = start + ch.length;
      if(ta) ta.value = line.text;
      updatePreviewOnly();
      showCharPreview(ch);
    });
  });

  const compareInput = document.getElementById('compareInput');
  if(compareInput){
    compareInput.addEventListener('input', renderCompare);
    renderCompare();
  }

  const saveBtn = document.getElementById('saveFontBtn');
  if(saveBtn){
    fillMeta(getActive());
    saveBtn.addEventListener('click', saveModifiedFont);
  }

  updateToolbarState();
}

function setupColor(codeId, paletteId, apply){
  const code = document.getElementById(codeId);
  if(!code) return;
  code.addEventListener('input', () => {
    const s = code.value.trim().replace(/^#/, '');
    if(/^[0-9a-fA-F]{6}$/.test(s) || /^[0-9a-fA-F]{8}$/.test(s)){
      apply('#' + s.toUpperCase());
      markSwatch(paletteId, '#' + s.toUpperCase());
    }
  });
  const pal = document.getElementById(paletteId);
  if(!pal) return;
  PALETTE.forEach(c => {
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'swatch';
    sw.style.background = c;
    sw.title = c;
    sw.dataset.color = c;
    sw.addEventListener('click', () => {
      code.value = c;
      apply(c);
      markSwatch(paletteId, c);
    });
    pal.appendChild(sw);
  });
  markSwatch(paletteId, code.value || '');
}

function markSwatch(paletteId, color){
  const pal = document.getElementById(paletteId);
  if(!pal) return;
  const target = (color || '').toLowerCase().slice(0, 7);
  pal.querySelectorAll('.swatch').forEach(s => {
    s.classList.toggle('active', (s.dataset.color || '').toLowerCase() === target);
  });
}

function updateToolbarState(){
  document.querySelectorAll('.align-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.align === previewAlign);
  });
  document.querySelectorAll('.valign-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.valign === previewVAlign);
  });
  const fsEl = document.getElementById('fontSizeLabel');
  if(fsEl) fsEl.textContent = previewFontSize;
  const fsi = document.getElementById('fontSizeInput');
  if(fsi) fsi.value = previewFontSize;
}

function updatePreviewOnly(){
  const pv = document.getElementById('livePreview');
  if(!pv) return;
  pv.style.background = parseColor(previewBgColor);
  pv.style.color = parseColor(previewTextColor);
  const vls = buildVisualLines();
  if(vls.length){
    pv.innerHTML = vls.map(vl => {
      const inner = vl.map((seg, i) => {
        const txt = escapeHtml(seg.text).replace(/\n/g, '<br>') || '&nbsp;';
        return '<span style="font-family:' + seg.family + ';font-size:' + previewFontSize + 'px;line-height:1.7">' + txt + '</span>' + (i < vl.length - 1 ? '&nbsp;' : '');
      }).join('');
      return '<div style="direction:rtl;text-align:' + previewAlign + ';unicode-bidi:isolate">' + inner + '</div>';
    }).join('');
  }else{
    pv.innerHTML = '<div style="direction:rtl;text-align:' + previewAlign + '">&nbsp;</div>';
  }
  refreshExportPreview();
}

function showCharPreview(ch){
  const ov = document.getElementById('charPreview');
  if(!ov) return;
  const line = activeLine();
  const fam = resolveFontFamily(line ? line.fontId : state.activeId);
  const g = document.getElementById('charPreviewGlyph');
  const c = document.getElementById('charPreviewCode');
  if(g){ g.style.fontFamily = fam; g.textContent = ch; }
  if(c) c.textContent = 'U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0');
  ov.classList.add('show');
}

function renderCompare(){
  const list = document.getElementById('compareList');
  if(!list) return;
  const txt = document.getElementById('compareInput').value;
  const content = txt ? escapeHtml(txt).replace(/\n/g, '<br>') : '<span style="opacity:.35">اكتب نص الأول</span>';
  list.innerHTML = '<div style="display:flex;gap:10px;align-items:stretch;overflow-x:auto;padding-bottom:6px">' +
    state.files.map(x => {
      const fam = resolveFontFamily(x.id);
      return '<div style="flex:0 0 auto;display:flex;flex-direction:column;gap:4px;max-width:320px">' +
        '<span style="font-size:10px;color:var(--muted)">' + escapeHtml(x.name) + '</span>' +
        '<span class="compare-text" style="font-family:' + fam + ';font-size:' + previewFontSize + 'px;text-align:' + previewAlign + ';border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel-3)">' + content + '</span>' +
        '</div>';
    }).join('') + '</div>';
}

function normalizeColor(c){
  let s = (c || '').trim();
  if(s[0] === '#') s = s.slice(1);
  if(s.length === 8) s = s.slice(0, 6);
  if(s.length === 3) s = s.split('').map(x => x + x).join('');
  if(s.length === 4) s = s.split('').map(x => x + x).join('');
  return '#' + s;
}

function parseColor(c){
  c = (c || '').trim();
  if(c[0] === '#') c = c.slice(1);
  if(c.length === 3) c = c.split('').map(x => x + x).join('');
  if(c.length === 4) c = c.split('').map(x => x + x).join('');
  if(c.length === 6) return '#' + c;
  if(c.length === 8){
    const r = parseInt(c.slice(0, 2), 16);
    const g = parseInt(c.slice(2, 4), 16);
    const b = parseInt(c.slice(4, 6), 16);
    const a = parseInt(c.slice(6, 8), 16) / 255;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  return c;
}

/* === ترتيب الكلمات في سطور بصرية (جنب بعض) === */
function layoutRows(mctx, vls, maxWidth, fontSize){
  const rows = [];
  vls.forEach(vl => {
    let row = [];
    let used = 0;
    vl.forEach(seg => {
      const fam = seg.family;
      const chunks = String(seg.text).split('\n');
      chunks.forEach((chunk, ci) => {
        if(ci > 0 && row.length){
          rows.push(row);
          row = [];
          used = 0;
        }
        mctx.font = fontSize + "px '" + fam + "'";
        const words = chunk.split(' ');
        words.forEach((w, wi) => {
          const piece = (!row.length && wi === 0) ? w : ' ' + w;
          const pw = mctx.measureText(piece).width;
          if(used + pw > maxWidth && row.length){
            rows.push(row);
            row = [];
            used = 0;
            row.push({ text: w, family: fam });
            used = mctx.measureText(w).width;
          }else{
            row.push({ text: piece, family: fam });
            used += pw;
          }
        });
      });
    });
    if(row.length) rows.push(row);
  });
  return rows;
}

function drawRow(ctx, mctx, row, y, fontSize, W, padding, fg){
  let totalW = 0;
  row.forEach(seg => {
    mctx.font = fontSize + "px '" + seg.family + "'";
    totalW += mctx.measureText(seg.text).width;
  });
  if(CANVAS_RTL){
    ctx.direction = 'rtl';
    ctx.textAlign = 'right';
    let x;
    if(previewAlign === 'right') x = W - padding;
    else if(previewAlign === 'left') x = padding + totalW;
    else x = W / 2 + totalW / 2;
    row.forEach(seg => {
      ctx.font = fontSize + "px '" + seg.family + "'";
      ctx.fillStyle = fg;
      ctx.fillText(seg.text, x, y);
      mctx.font = fontSize + "px '" + seg.family + "'";
      x -= mctx.measureText(seg.text).width;
    });
  }else{
    ctx.direction = 'ltr';
    ctx.textAlign = 'left';
    let x;
    if(previewAlign === 'right') x = W - padding - totalW;
    else if(previewAlign === 'left') x = padding;
    else x = W / 2 - totalW / 2;
    [...row].reverse().forEach(seg => {
      ctx.font = fontSize + "px '" + seg.family + "'";
      ctx.fillStyle = fg;
      ctx.fillText(Array.from(seg.text).reverse().join(''), x, y);
      mctx.font = fontSize + "px '" + seg.family + "'";
      x += mctx.measureText(seg.text).width;
    });
  }
}

/* === حساب التنسيق === */
function computeExportLayout(){
  const vls = buildVisualLines();
  if(!vls.length) return null;
  const padding = 44;
  const Wspec = previewWidth;
  const Hspec = previewHeight;
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');

  let W;
  if(Wspec > 0){
    W = Wspec;
  }else{
    let maxW = 0;
    vls.forEach(vl => {
      vl.forEach(seg => {
        mctx.font = previewFontSize + "px '" + seg.family + "'";
        String(seg.text).split('\n').forEach(chunk => { maxW = Math.max(maxW, mctx.measureText(chunk).width); });
      });
    });
    W = Math.max(200, Math.min(2000, Math.ceil(maxW + padding * 2)));
  }
  const maxWidth = W - padding * 2;

  let fontSize = previewFontSize;
  let rows = layoutRows(mctx, vls, maxWidth, fontSize);
  let neededH = rows.length * fontSize * 1.7 + padding * 2;
  if(Hspec > 0 && neededH > Hspec){
    for(let i = 0; i < 8; i++){
      const scale = (Hspec - padding * 2) / Math.max(1, rows.length * fontSize * 1.7);
      if(scale <= 0) break;
      fontSize = Math.max(10, fontSize * scale);
      rows = layoutRows(mctx, vls, W - padding * 2, fontSize);
      neededH = rows.length * fontSize * 1.7 + padding * 2;
      if(neededH <= Hspec) break;
    }
  }

  const lineHeight = fontSize * 1.7;
  const height = Hspec > 0 ? Hspec : Math.max(lineHeight * 1.6, neededH);
  return { W, height, fontSize, rows, lineHeight, padding };
}

/* === رسم الكانفس بمقاس معين === */
function renderExportCanvas(scale){
  const lay = computeExportLayout();
  if(!lay) return null;
  const { W, height, fontSize, rows, lineHeight, padding } = lay;
  const bg = parseColor(previewBgColor);
  const fg = parseColor(previewTextColor);
  const ext = previewFormat || 'png';
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');

  /* المحاذاة الرأسية: أعلى / وسط / أسفل */
  const contentH = rows.length * lineHeight;
  let startY;
  if(previewVAlign === 'top') startY = padding;
  else if(previewVAlign === 'bottom') startY = Math.max(padding, height - contentH - padding);
  else startY = Math.max(padding, (height - contentH) / 2);

  const attempts = [scale, 1];
  for(const s of attempts){
    try{
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.ceil(W * s));
      cv.height = Math.max(1, Math.ceil(height * s));
      const ctx = cv.getContext('2d');
      ctx.scale(s, s);

      if(ext === 'jpg'){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, height); }
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, height);

      ctx.textBaseline = 'middle';

      let y = startY + lineHeight / 2;
      rows.forEach(row => {
        drawRow(ctx, mctx, row, y, fontSize, W, padding, fg);
        y += lineHeight;
      });
      return { canvas: cv, width: cv.width, height: cv.height };
    }catch(e){ console.warn(e); }
  }
  return null;
}

/* === المعاينة المصغرة === */
function refreshExportPreview(){
  const holder = document.getElementById('exportPreview');
  const wrap = document.getElementById('exportPreviewWrap');
  if(!holder || !wrap) return;
  const lay = computeExportLayout();
  if(!lay){ wrap.style.display = 'none'; return; }

  const pvScale = Math.max(0.2, Math.min(1, 420 / lay.W));
  const res = renderExportCanvas(pvScale);
  if(!res){ wrap.style.display = 'none'; return; }
  holder.src = res.canvas.toDataURL('image/png');
  wrap.style.display = 'block';

  let finalScale = Math.max(1, previewScale || 1);
  const MAX_DIM = 8192;
  if(lay.W * finalScale > MAX_DIM) finalScale = Math.max(1, Math.floor(MAX_DIM / lay.W));
  if(lay.height * finalScale > MAX_DIM) finalScale = Math.max(1, Math.floor(MAX_DIM / lay.height));
  const vName = previewVAlign === 'top' ? 'أعلى' : previewVAlign === 'bottom' ? 'أسفل' : 'وسط';
  const info = document.getElementById('exportPreviewInfo');
  if(info) info.textContent = 'معاينة — الصورة النهائية هتكون ' + Math.ceil(lay.W * finalScale) + '×' + Math.ceil(lay.height * finalScale) + ' بكسل — محاذاة: ' + vName;
}

/* === التحميل === */
function downloadPreviewAsImage(){
  const vls = buildVisualLines();
  if(!vls.length){ toast('اكتب نص الأول', 'err'); return; }
  const lay = computeExportLayout();
  if(!lay){ toast('اكتب نص الأول', 'err'); return; }

  let scale = Math.max(1, previewScale || 1);
  const MAX_DIM = 8192;
  if(lay.W * scale > MAX_DIM) scale = Math.max(1, Math.floor(MAX_DIM / lay.W));
  if(lay.height * scale > MAX_DIM) scale = Math.max(1, Math.floor(MAX_DIM / lay.height));

  const res = renderExportCanvas(scale);
  if(!res){ toast('فشل تصدير الصورة — قلل الجودة شوية', 'err'); return; }

  const mimeMap = { png: 'image/png', jpg: 'image/jpeg', webp: 'image/webp' };
  let dataUrl = null;
  try{ dataUrl = res.canvas.toDataURL(mimeMap[previewFormat || 'png'] || 'image/png', 0.92); }catch(e){}
  if(!dataUrl || !dataUrl.startsWith('data:image')){ toast('فشل تصدير الصورة — قلل الجودة شوية', 'err'); return; }

  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'text-preview-' + Date.now() + '.' + (previewFormat || 'png');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('تم تحميل الصورة — ' + res.width + '×' + res.height, 'ok');
}

/* === بيانات الخط === */
function readName(font, key, def){
  try{
    if(!font || !font.names) return def;
    const langKeys = Object.keys(font.names);
    const lang = langKeys.find(k => /^[a-z]{2}(-[A-Za-z0-9]+)?$/i.test(k)) || 'en';
    if(font.names[lang] && typeof font.names[lang] === 'object'){
      return font.names[lang][key] || def;
    }
    if(font.names[key] && typeof font.names[key] === 'object'){
      return font.names[key][lang] || font.names[key].en || def;
    }
    return def;
  }catch(e){ return def; }
}

function fillMeta(f){
  if(!f || !f.font) return;
  const set = (id, val) => { const el = document.getElementById(id); if(el) el.value = val || ''; };
  set('metaName', readName(f.font, 'fontFamily', f.name.replace(/\.ttf$/i, '')));
  set('metaFull', readName(f.font, 'fullName', ''));
  set('metaVersion', readName(f.font, 'version', ''));
  set('metaPS', readName(f.font, 'postScriptName', ''));
  set('metaDesigner', readName(f.font, 'designer', ''));
  set('metaManufacturer', readName(f.font, 'manufacturer', ''));
  set('metaCopyright', readName(f.font, 'copyright', ''));
  set('metaLicense', readName(f.font, 'license', ''));
  set('metaTrademark', readName(f.font, 'trademark', ''));
  set('metaDescription', readName(f.font, 'description', ''));
}

function setNames(out, fields){
  try{
    if(!out.names || typeof out.names !== 'object') return;
    const langKeys = Object.keys(out.names);
    const lang = langKeys.find(k => /^[a-z]{2}(-[A-Za-z0-9]+)?$/i.test(k)) || 'en';
    const newFormat = out.names[lang] && typeof out.names[lang] === 'object';
    const set = (key, val) => {
      if(val === undefined || val === null || val === '') return;
      if(newFormat){
        out.names[lang][key] = val;
      }else{
        if(!out.names[key]) out.names[key] = {};
        out.names[key][lang] = val;
      }
    };
    set('fontFamily', fields.fontFamily);
    set('fullName', fields.fullName);
    set('postScriptName', fields.postScriptName);
    set('version', fields.version);
    set('designer', fields.designer);
    set('manufacturer', fields.manufacturer);
    set('copyright', fields.copyright);
    set('license', fields.license);
    set('trademark', fields.trademark);
    set('description', fields.description);
  }catch(e){ console.error(e); }
}

function saveModifiedFont(){
  const f = getActive();
  if(!f || !f.font){ toast('الملف ده مش قابل للتعديل', 'err'); return; }
  try{
    const out = f.font;
    const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const newName = v('metaName') || f.name.replace(/\.ttf$/i, '');
    setNames(out, {
      fontFamily: newName,
      fullName: v('metaFull') || newName,
      postScriptName: (v('metaPS') || newName).replace(/[^A-Za-z0-9]/g, '') || 'ModifiedFont',
      version: v('metaVersion'),
      designer: v('metaDesigner'),
      manufacturer: v('metaManufacturer'),
      copyright: v('metaCopyright'),
      license: v('metaLicense'),
      trademark: v('metaTrademark'),
      description: v('metaDescription')
    });
    const buf = out.toArrayBuffer();
    const blob = new Blob([buf], { type: 'font/ttf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (newName.replace(/\s+/g, '-') || 'font-modified') + '.ttf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast('تم تنزيل النسخة المعدّلة', 'ok');
  }catch(e){
    toast('فشل التعديل: ' + e.message, 'err');
    console.error(e);
  }
}

function toast(msg, type){
  const box = document.getElementById('toasts');
  if(!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

window.addEventListener('error', e => {
  toast('خطأ: ' + (e.message || 'حصل خطأ غير متوقع'), 'err');
  console.error(e);
});
window.addEventListener('load', () => {
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
});
